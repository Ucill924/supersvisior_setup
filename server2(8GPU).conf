cat > /etc/supervisor/conf.d/boundless-gpu.conf <<'EOF'

[group:GPU]
programs=gpu_prove_agent1,gpu_prove_agent2,gpu_prove_agent3,gpu_prove_agent4,gpu_prove_agent5,gpu_prove_agent6,gpu_prove_agent7,gpu_prove_agent8

####################################
# GPU 1
####################################
[program:gpu_prove_agent1]
command=/app/agent -t prove --redis-ttl 57600
directory=/app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
priority=51
stdout_logfile=/var/log/gpu_prove_agent1.log
redirect_stderr=true
environment=CUDA_VISIBLE_DEVICES="0",REDIS_URL="redis://Alamat_ip_internaal_server1:6379",DATABASE_URL="postgresql://worker:password@Alamat_ip_internaal_server1:5432/taskdb",S3_URL="http://Alamat_ip_internaal_server1:9000",S3_BUCKET="workflow",S3_ACCESS_KEY="admin",S3_SECRET_KEY="password",RUST_LOG="info",RUST_BACKTRACE="1",POVW_LOG_ID="Alamat_wallet_sever1"

